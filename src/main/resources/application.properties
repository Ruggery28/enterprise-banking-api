# 1. The address of your local database (this will automatically create the database 'bank_db' if it doesn't exist yet)
spring.datasource.url=jdbc:mysql://localhost:3306/bank_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Pass1234!

# 2. Tell Hibernate to automatically create/update your SQL tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update

# 3. Print the raw SQL commands directly into your IntelliJ console so you can see what Hibernate is doing behind the scenes
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true